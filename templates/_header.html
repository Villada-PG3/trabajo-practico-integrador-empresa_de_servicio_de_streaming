<header>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-netflix fixed-top px-4">
        <div class="container-fluid">
            <a class="navbar-brand-logo me-4" href="{% url 'home' %}">STREAMING</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                {% if user.is_authenticated %}
                    <!-- Menú para usuarios con sesión iniciada -->
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" href="{% url 'home' %}">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Series</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Películas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Mi Lista</a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center gap-3">
                        <a href="#" class="text-light fs-5"><i class="bi bi-search"></i></a>
                        <div class="dropdown">
                            <button class="btn btn-secondary dropdown-toggle bg-transparent border-0 d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                                <i class="bi bi-person-square fs-4"></i>
                                <span class="text-light small">{{ user.email|default:user.username }}</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
                                <li><a class="dropdown-item" href="#">Cambiar Perfil</a></li>
                                <li><a class="dropdown-item" href="#">Cuenta</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="{% url 'logout' %}">Cerrar sesión</a></li>
                            </ul>
                        </div>
                    </div>
                {% else %}
                    <!-- Menú para visitantes / landing page con botones de Login y Registro -->
                    <div class="ms-auto d-flex align-items-center gap-3">
                        <a href="{% url 'login' %}" class="text-white text-decoration-none fw-semibold">Iniciar sesión</a>
                        <a href="{% url 'registro' %}" class="btn btn-netflix btn-sm">Registrarse</a>
                    </div>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
