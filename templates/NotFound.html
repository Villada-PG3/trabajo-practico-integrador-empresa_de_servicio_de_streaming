{% extends "base.html" %}

{% block title %}NotFound - RedFlix{% endblock %}

{% block extra_css %}
<style>
    .not-found-page {
        min-height: 80vh;
        background:
            linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)),
            url('https://picsum.photos/1920/1080') center / cover no-repeat;
    }

    .not-found-content {
        max-width: 700px;
    }
</style>
{% endblock %}

{% block content %}
<section class="not-found-page d-flex align-items-center justify-content-center px-4 py-5 text-center">
    <div class="not-found-content">
        <p class="text-uppercase text-danger fw-bold mb-2">NotFound</p>
        <h1 class="display-3 fw-bold mb-4">¿Te perdiste?</h1>
        <a class="btn btn-netflix btn-lg" href="{% url 'pagina_inicial' %}">Volver a inicio</a>
    </div>
</section>
{% endblock %}
